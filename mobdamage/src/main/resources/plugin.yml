name: MobDamageReducer
version: 1.0.0
main: com.troll.mobdamage.MobDamageReducer
api-version: '1.21'
author: toi
description: Réduit de 40% les dégâts infligés par les mobs aux joueurs. Activable/désactivable via console ou joueur OP uniquement.

commands:
  mobdamage:
    description: Active/désactive la réduction de dégâts des mobs
    usage: /mobdamage <on|off|status>
    permission: mobdamage.toggle
    permission-message: "§cSeule la console ou un joueur OP peut utiliser cette commande."

permissions:
  mobdamage.toggle:
    description: Autorise à activer/désactiver la réduction de dégâts des mobs
    default: op
