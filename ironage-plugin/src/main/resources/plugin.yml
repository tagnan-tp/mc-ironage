name: IronAge
version: 1.0.0
main: fr.ironage.plugin.IronAgePlugin
api-version: '1.21'
author: Toi
description: Verrouille le serveur a l'age de fer - le diamant devient un artefact unique distribue par /ironage
commands:
  ironage:
    description: Distribue/supprime/reroll/donne les objets en diamant uniques (console uniquement, action confirmee via /ironage confirm).
    usage: /ironage [reset|reroll|chestgive <joueur>|give <OBJET> <joueur>|confirm]
    permission: ironage.admin
  ironquick:
    description: Comme /ironage (distribution des objets) mais SANS le decompte de 10 secondes (console uniquement, a confirmer via /ironage confirm).
    usage: /ironquick
    permission: ironage.admin
  coifeur:
    description: 'Active/desactive la reponse automatique "Feur" quand un joueur dit "quoi" dans le tchat (console uniquement).'
    usage: /coifeur
    permission: ironage.admin
  villagermultiplier:
    description: Regle le multiplicateur du prix des livres enchantes chez les villageois (OP uniquement).
    usage: /villagermultiplier [valeur]
    permission: ironage.admin
  force:
    description: Donne une splash potion de Force II fonctionnelle, la seule autorisee (OP ou console).
    usage: /force give [joueur] [quantite]
    permission: ironage.admin
  irontest:
    description: Diagnostic - applique une configuration de modules predefinie pour tester (OP ou console).
    usage: /irontest [numero|reset]
    aliases: [itest]
    permission: ironage.admin
  diamondhoe:
    description: Reroll manuel de la cible verrouillee par la houe en diamant (joueur avec la houe en main uniquement).
    usage: /diamondhoe [op]
permissions:
  ironage.admin:
    description: Acces aux commandes d'administration IronAge
    default: op
