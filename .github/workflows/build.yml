name: Build MobDamageReducer plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobdamage
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: mobdamage/pom.xml

      - name: Compiler avec Maven
        run: mvn -B clean package

      - name: Publier le .jar compile
        uses: actions/upload-artifact@v4
        with:
          name: mobdamage-plugin-jar
          path: mobdamage/target/*.jar
