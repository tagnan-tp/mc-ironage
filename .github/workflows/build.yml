```yaml
name: Build IronAge plugin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build IronAge
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ironage-plugin/pom.xml

      - name: Compiler le plugin
        working-directory: ironage-plugin
        run: mvn --batch-mode clean package

      - name: Publier le JAR
        uses: actions/upload-artifact@v4
        with:
          name: ironage-plugin
          path: ironage-plugin/target/*.jar
          if-no-files-found: error
```
