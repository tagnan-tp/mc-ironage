```yaml
name: Build IronAge plugin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ironage-plugin/pom.xml

      - name: Verifier le projet
        run: |
          echo "Contenu du depot :"
          ls -la
          echo ""
          echo "Contenu de ironage-plugin :"
          ls -la ironage-plugin
          echo ""
          echo "Verification du pom.xml :"
          test -f ironage-plugin/pom.xml

      - name: Compiler avec Maven
        working-directory: ironage-plugin
        run: mvn --batch-mode clean package

      - name: Verifi
```
